# version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: panbox-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: panbox
      MYSQL_USER: panbox
      MYSQL_PASSWORD: panbox123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - panbox-network

  # MinIO 对象存储
  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: panbox-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API 端口
      - "9001:9001"  # Web UI 端口
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - panbox-network

